# fly.toml app configuration file generated for appsensi-server on 2026-11-11T11:05:07+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'appsensi-server'
primary_region = 'nrt'

[build]
  [build.args]
    GO_VERSION = '1.27.0'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
